[project]
name = "americanstories"
version = "0.1.0"
description = "American Stories newspaper layout + EffOCR inference (Dell Research Harvard), on current libraries"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Inference path only: src/run_img2txt_yolo_pipeline.py and src/run_img2layout_pipeline.py and what
# they import. Training code (xcit, detectron2, mmdet, tensorflow) keeps the original requirements.txt.
dependencies = [
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "torch>=2.5",
    "torchvision>=0.20",
    "faiss-cpu>=1.9",
    "pytorch-metric-learning>=2.7",
    "timm>=1.0",
    "albumentations>=1.4",
    "kornia>=0.7",
    "symspellpy>=6.7",
    "nltk>=3.9",
    "rdflib>=7",
    "requests>=2.32",
    "tqdm>=4.66",
    "psutil>=6",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
pdf = ["pikepdf>=9"]

[tool.uv]
package = false
